name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/facilitator.js
          node --check assets/js/participant.js
          node --check assets/js/screen.js\n          node --check assets/js/confetti.js
          node --input-type=module --check < assets/js/three-scenes.js
